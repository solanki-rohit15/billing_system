## Server Configuration
server.port=8082
spring.application.name=faculty-billing-portal

### Database Configuration (H2 for development - change to MySQL/PostgreSQL for production)
##spring.datasource.url=jdbc:h2:mem:billingdb
##spring.datasource.driverClassName=org.h2.Driver
##spring.datasource.username=sa
##spring.datasource.password=
#
## H2 Console (for development only)
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

## JPA Configuration
##spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
##spring.jpa.hibernate.ddl-auto=update
##spring.jpa.show-sql=true
##spring.jpa.properties.hibernate.format_sql=true
#
## Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.davv.billing=DEBUG

## For MySQL (uncomment and configure for production)
## spring.datasource.url=jdbc:mysql://localhost:3306/faculty_billing?createDatabaseIfNotExist=true
## spring.datasource.username=root
## spring.datasource.password=yourpassword
## spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
#
# For PostgreSQL (alternative for production)
spring.datasource.url=jdbc:postgresql://localhost:5432/faculty_billing
spring.datasource.username=postgres
spring.datasource.password=root

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Email Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# OTP Configuration
otp.expiration.minutes=5

# CORS
cors.allowed.origins=http://localhost:5173,http://localhost:3000
