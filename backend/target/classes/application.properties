## Server Configuration
server.port=8082
spring.application.name=faculty-billing-portal

### Database Configuration (H2 for development - change to MySQL/PostgreSQL for production)
##spring.datasource.url=jdbc:h2:mem:billingdb
##spring.datasource.driverClassName=org.h2.Driver
##spring.datasource.username=sa
##spring.datasource.password=
#
## H2 Console (for development only)
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

## JPA Configuration
##spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
##spring.jpa.hibernate.ddl-auto=update
##spring.jpa.show-sql=true
##spring.jpa.properties.hibernate.format_sql=true
#
## Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.davv.billing=DEBUG

## For MySQL (uncomment and configure for production)
## spring.datasource.url=jdbc:mysql://localhost:3306/faculty_billing?createDatabaseIfNotExist=true
## spring.datasource.username=root
## spring.datasource.password=yourpassword
## spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
#
# For PostgreSQL (alternative for production)
spring.datasource.url=jdbc:postgresql://localhost:5432/faculty_billing
spring.datasource.username=postgres
spring.datasource.password=root

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

